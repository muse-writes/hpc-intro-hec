#------------------------------------------------------------
# Values for this lesson.
#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, or cp)?
# swc: Software Carpentry
# dc: Data Carpentry
# lc: Library Carpentry
# cp: Carpentries (to use for instructor training for instance)
# incubator: The Carpentries Incubator
# Note that you can also use a custom carpentry type. For more info,
# see the documentation: https://carpentries.github.io/sandpaper-docs/editing.html
carpentry: 'cp'

# Custom carpentry description
# This will be used as the alt text for the logo
# carpentry_description: "Custom Carpentry"

# Overall title for pages.
title: 'Using High-Performance Computing Systems'

# Date the lesson was created (YYYY-MM-DD, this is empty by default)
created: 2017-03-24

# Comma-separated list of keywords for the lesson
keywords: 'software, data, lesson, The Carpentries'

# Life cycle stage of the lesson
# possible values: pre-alpha, alpha, beta, stable
life_cycle: 'beta'

# License of the lesson materials (recommended CC-BY 4.0)
license: 'CC-BY 4.0'

# Link to the source repository for this lesson
source: 'https://github.com/muse-writes/hpc-intro-hec'

# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'd.k.johnson@lancaster.ac.uk'

# Navigation ------------------------------------------------
#
# Use the following menu items to specify the order of
# individual pages in each dropdown section. Leave blank to
# include all pages in the folder.
#
# Example -------------
#
# episodes:
# - introduction.md
# - first-steps.md
#
# learners:
# - setup.md
#
# instructors:
# - instructor-notes.md
#
# profiles:
# - one-learner.md
# - another-learner.md

# Order of episodes in your lesson
episodes:
  - 10-hpc-intro.Rmd
  - 11-connecting.Rmd
  - 12-cluster.Rmd
  - 13-scheduler.Rmd
  - 14-environment-variables.Rmd
  - 15-modules.Rmd
  - 16-transferring-files.Rmd
  - 17-parallel.Rmd
  - 18-resources.Rmd
  - 19-responsibility.Rmd
#  - 20-luna.Rmd

# Information for Learners
learners:
  - setup.md

# Information for Instructors
instructors:
  - instructor-notes.Rmd

# Learner Profiles
profiles:
  - learner-profiles.md

# Customisation ---------------------------------------------
#
# This space below is where custom yaml items (e.g. pinning
# sandpaper and varnish versions) should live

# CONFIGURING FOR YOUR SYSTEM (sandpaper >= 0.21.0 native customization)
#
# Episodes may reference `config$...` values and `snippets()` placeholders,
# which sandpaper resolves from the following folders within
# episodes/files/customization/ (each folder contains _config_options.yml
# and an optional snippets/ subdirectory):

# Base customization: platform-neutral defaults (also used as fallback)
workbench_base_customization: HPCC_MagicCastle_slurm

# Overlay customization for our system (overrides base values).
# Can be overridden per-build with the WORKBENCH_OVERLAY_CUSTOMIZATION
# environment variable (e.g. as a GitHub Actions repository variable).
workbench_overlay_customization: LAN_HEC_slurm

carpentry_description: Lesson Description
url: 'https://muse-writes.github.io/hpc-intro-hec/'
analytics: carpentries
lang: en
